; Optional: use this instead of the Arduino IDE.
; Keeps smart_shade.ino and webui.h in the project root.
[platformio]
src_dir = .

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  gin66/FastAccelStepper
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager

; For an ESP32-S3 board, change to:
;   board = esp32-s3-devkitc-1
