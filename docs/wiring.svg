<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Smart Shade wiring</text>

  <!-- ESP32 -->
  <rect x="40" y="90" width="200" height="270" rx="10" fill="#e8f1ff" stroke="#2457a6" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-weight="bold" fill="#123">ESP32-C3 / S3</text>
  <g fill="#123">
    <text x="225" y="165" text-anchor="end">GPIO 4</text>
    <text x="225" y="205" text-anchor="end">GPIO 5</text>
    <text x="225" y="245" text-anchor="end">GPIO 6</text>
    <text x="225" y="285" text-anchor="end">3V3</text>
    <text x="225" y="325" text-anchor="end">GND</text>
    <text x="55" y="345" font-size="13" fill="#555">5V in from buck converter</text>
  </g>

  <!-- TMC2209 -->
  <rect x="380" y="90" width="190" height="270" rx="10" fill="#fff3e0" stroke="#b25e00" stroke-width="2"/>
  <text x="475" y="118" text-anchor="middle" font-weight="bold" fill="#321">TMC2209 driver</text>
  <g fill="#321">
    <text x="395" y="165">STEP</text>
    <text x="395" y="205">DIR</text>
    <text x="395" y="245">EN</text>
    <text x="395" y="285">VIO</text>
    <text x="395" y="325">GND (logic)</text>
    <text x="555" y="165" text-anchor="end">VM</text>
    <text x="555" y="205" text-anchor="end">GND</text>
    <text x="555" y="255" text-anchor="end">1B 1A</text>
    <text x="555" y="295" text-anchor="end">2A 2B</text>
  </g>

  <!-- signal wires -->
  <g stroke="#2457a6" stroke-width="2.5" fill="none">
    <line x1="240" y1="160" x2="380" y2="160"/>
    <line x1="240" y1="200" x2="380" y2="200"/>
    <line x1="240" y1="240" x2="380" y2="240"/>
    <line x1="240" y1="280" x2="380" y2="280"/>
  </g>
  <line x1="240" y1="320" x2="380" y2="320" stroke="#111" stroke-width="2.5"/>

  <!-- motor -->
  <rect x="690" y="215" width="170" height="100" rx="10" fill="#eaf7ea" stroke="#2b7a2b" stroke-width="2"/>
  <text x="775" y="255" text-anchor="middle" font-weight="bold" fill="#132">NEMA 17</text>
  <text x="775" y="278" text-anchor="middle" fill="#132">stepper motor</text>
  <g stroke="#2b7a2b" stroke-width="2.5">
    <line x1="570" y1="250" x2="690" y2="235"/>
    <line x1="570" y1="290" x2="690" y2="295"/>
  </g>
  <text x="630" y="335" text-anchor="middle" font-size="13" fill="#555">never plug in or unplug</text>
  <text x="630" y="352" text-anchor="middle" font-size="13" fill="#555">the motor with 12V on</text>

  <!-- 12V supply -->
  <rect x="690" y="90" width="170" height="70" rx="10" fill="#fdeaea" stroke="#a62424" stroke-width="2"/>
  <text x="775" y="120" text-anchor="middle" font-weight="bold" fill="#311">12V 2A supply</text>
  <text x="775" y="142" text-anchor="middle" fill="#311">+ and -</text>
  <g stroke="#a62424" stroke-width="2.5" fill="none">
    <polyline points="690,110 620,110 620,160 570,160"/>
  </g>
  <polyline points="690,140 600,140 600,200 570,200" stroke="#111" stroke-width="2.5" fill="none"/>
  <text x="640" y="104" font-size="13" fill="#a62424">+12V</text>
  <text x="612" y="134" font-size="13" fill="#111">GND</text>

  <!-- capacitor -->
    <rect x="560" y="368" width="320" height="34" rx="6" fill="#fffbe0" stroke="#999"/>
  <text x="720" y="390" text-anchor="middle" font-size="13" fill="#333">100 uF capacitor across VM and GND, close to the driver</text>

  <!-- button -->
  <rect x="40" y="410" width="200" height="60" rx="10" fill="#f3e8ff" stroke="#6b2fa6" stroke-width="2"/>
  <text x="140" y="435" text-anchor="middle" font-weight="bold" fill="#213">Button (optional)</text>
  <text x="140" y="456" text-anchor="middle" font-size="13" fill="#213">GPIO 7 to GND, no resistor</text>

  <!-- ground note -->
  <rect x="270" y="410" width="300" height="60" rx="10" fill="#f4f4f4" stroke="#999"/>
  <text x="420" y="435" text-anchor="middle" font-weight="bold" fill="#222">Common ground</text>
  <text x="420" y="456" text-anchor="middle" font-size="13" fill="#222">12V supply - joins ESP32 GND and driver GND</text>

  <!-- legend -->
  <g font-size="13">
    <line x1="600" y1="440" x2="630" y2="440" stroke="#2457a6" stroke-width="2.5"/><text x="638" y="445" fill="#333">signal</text>
    <line x1="600" y1="462" x2="630" y2="462" stroke="#a62424" stroke-width="2.5"/><text x="638" y="467" fill="#333">+12V power</text>
    <line x1="740" y1="440" x2="770" y2="440" stroke="#111" stroke-width="2.5"/><text x="778" y="445" fill="#333">ground</text>
    <line x1="740" y1="462" x2="770" y2="462" stroke="#2b7a2b" stroke-width="2.5"/><text x="778" y="467" fill="#333">motor coils</text>
  </g>
</svg>
